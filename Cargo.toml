[package]
name = "libqb"
version = "0.1.0"
edition = "2021"
description = "Rust port of libqb: high-performance IPC, logging, and data structures"
license = "LGPL-2.1"
readme = "README.md"

[lib]
name = "qb"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
libc = "0.2"
mio = { version = "1.0", features = ["os-poll", "os-ext", "net"] }
parking_lot = "0.12"
log = "0.4"
regex = { version = "1", optional = true }

[features]
default = []
log-regex-filters = ["regex"]

[build-dependencies]
cbindgen = "0.29"
cc = "=1.2.67"
