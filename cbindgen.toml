language = "C"
style = "both"
sys_includes = ["time.h", "sys/uio.h"]
after_includes = """
#ifndef __QB_COMPAT_TYPES
#define __QB_COMPAT_TYPES
typedef struct timespec timespec;
typedef struct iovec iovec;
#endif
"""
include_guard = "QB_H"
pragma_once = true
documentation = true
documentation_style = "C"
cpp_compat = true

header = """
/* Automatically generated by cbindgen. Do not edit manually. */
/* libqb — Rust port of the ClusterLabs libqb library */
"""

[export]
include = ["QbIpcRequestHeader", "QbIpcResponseHeader", "QbListHead"]
exclude = [
  "qb_list_init",
  "qb_list_add",
  "qb_list_add_tail",
  "qb_list_del",
  "qb_list_replace",
  "qb_list_empty",
  "qb_list_length",
  "qb_list_is_last",
  "qb_list_splice",
  "qb_list_splice_tail",
]

[export.rename]
"QbArray" = "qb_array_t"
"QbMap" = "qb_map_t"
"QbMapIter" = "qb_map_iter"
"QbHdb" = "qb_hdb"
"QbHandle" = "qb_handle_t"
"QbThreadLock" = "qb_thread_lock_t"
"QbStopwatch" = "qb_util_stopwatch_t"
"QbRingbuffer" = "qb_ringbuffer_t"
"QbLoop" = "qb_loop_t"
"QbLoopTimerHandle" = "qb_loop_timer_handle"
"QbIpccConnection" = "qb_ipcc_connection_t"
"QbIpcsService" = "qb_ipcs_service_t"
"QbIpcsConnection" = "qb_ipcs_connection_t"
"QbIpcRequestHeader" = "qb_ipc_request_header"
"QbIpcResponseHeader" = "qb_ipc_response_header"
"QbIpcsStats" = "qb_ipcs_stats"
"QbIpcsConnectionStats" = "qb_ipcs_connection_stats"
"QbIpcsConnectionStats2" = "qb_ipcs_connection_stats_2"
"QbIpcsPollHandlers" = "qb_ipcs_poll_handlers"
"QbIpcsServiceHandlers" = "qb_ipcs_service_handlers"
"QbLogCallsite" = "qb_log_callsite"
"QbVersion" = "qb_version"
"QbListHead" = "qb_list_head"
"QbLoopPriority" = "qb_loop_priority"
"QbIpcType" = "qb_ipc_type"
"QbThreadLockType" = "qb_thread_lock_type_t"
"QbLogConf" = "qb_log_conf"
"QbLogFilterType" = "qb_log_filter_type"
"QbLogFilterConf" = "qb_log_filter_conf"
"QbMapNotifyFlags" = "qb_map_notify_flags"
"QbIpcsRateLimit" = "qb_ipcs_rate_limit"
